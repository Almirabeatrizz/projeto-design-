<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Panificadora Richelly | Cardápios de Lanches </title>
  <link rel="stylesheet" href="stylepr.css">
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a class="brand" href="indexpr.html"><span class="brand-mark"> 🥖 </span> <span> Panificadora Richelly </span></a>
    <nav class="nav-links" aria-label="Navegação principal">
      <a class="" href="indexpr.html"> Início </a>
      <a class="active" href="lanchespr.html"> Lanches </a>
      <a href="indexpr.html"> Sobre Nós </a>
    </nav>
  </div>
</header>

<main class="container">
  <section class="page-heading">
    <h1> 🥖 Lanches Artesanais da Richelly </h1>
    <p> Pão Francês quentinho, crocante e super recheado. Escolha o seu favorito!</p>
  </section>
  <form id="busca" class="filters" action="#" method="get">
    <input type="search" name="nome" placeholder="⌕  Buscar por nome..." aria-label="Buscar por nome">
    <button class="btn btn-yellow" type="submit">Buscar</button>
  </form>
  <section class="dog-grid" id="lanche-list"></section>
</main>

<footer class="site-footer">
  <div class="container">🥖 Panificadora Richelly — O melhor pão quentinho e lanche da cidade. </div>
</footer>
<script src="./scriptpr.js"></script>
<script>
  const lanche_list = document.getElementById("lanche-list");
  const busca = document.getElementById("busca");
  busca.addEventListener("submit", function(e){
    lanche_list.innerHTML = "";
    e.preventDefault();
    let nome = busca.nome.value.toLowerCase().trim();
    for(let i = 0; i< lista.length; i++){
      let item = lista[i];
      if (item.nome.toLowerCase().includes(nome)){
        lanche_list.append(item.card());
      }
    }

  })

  window.addEventListener("load", function(e){
    lanche_list.innerHTML = "";
    for(let i = 0; i < lista.length; i++){
      let item = lista[i];
      lanche_list.append(item.card());
    }
  });
</script>
</body>
</html>
